<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply the saved theme before first paint (kept in sync with src/stores/theme.ts).
      (function () {
        var c = 'dark';
        try { c = localStorage.getItem('pitch-coach-theme') || 'dark'; } catch (e) {}
        if (c === 'system') c = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = c === 'light' ? 'light' : 'dark';
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Pitch Coach — Local Rehearsal Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
