[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pitch-coach"
version = "4.0.0"
description = "Real-time voice-first startup pitch coaching with multi-AI orchestration and local owner security."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Pitch Coach Contributors" }]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "python-pptx>=1.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
markers = ["live: calls real AI provider APIs (needs API keys in the environment)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]  # long lines; FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]  # sys.path bootstrap before app imports
"tests/conftest.py" = ["E402"]  # env must be set before importing the app

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
